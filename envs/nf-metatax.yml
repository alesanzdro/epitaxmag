# Conda environment for the EpiTaxMAG pipeline — TAX phase.
# Nextflow creates and caches it automatically under work/conda/.
# Covers QC, trimming, taxonomy, and the Python libraries used for PDF reports.
name: nf-metatax
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # QC
  - nanoplot>=1.43
  - fastqc>=0.12
  - multiqc>=1.25
  - fastq-screen>=0.15
  - minimap2>=2.28
  - samtools>=1.21
  # Trimming / filtering
  - porechop_abi>=0.5
  - chopper>=0.9
  # Read-level taxonomy
  - kraken2>=2.1.3
  - bracken>=3.0
  - kaiju>=1.10
  - sylph>=0.7
  # Utils
  - pigz
  - seqkit>=2.8
  # Python (scripts QC + reportes PDF)
  - python>=3.10
  - pandas
  - numpy
  - matplotlib
  - reportlab
