# Lightweight environment for the interactive Plotly HTML and Excel reports.
# EpiTaxMAG — FISABIO EPIMOL
name: nf-metatax-html
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - pandas
  - numpy
  - plotly>=5.0
  - openpyxl>=3.1     # required by scripts/generate_excel_report.py
