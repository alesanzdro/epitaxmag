# ============================================================
# MultiQC Configuration — EpiTax / EpiTaxMAG Pipeline
# ============================================================
# This file is passed automatically to MultiQC by the MULTIQC
# process in workflow/tax/main.nf
# ============================================================

# ── Sample-name cleanup ───────────────────────────────────────
# Strip suffixes that individual tools append, so that all the
# metrics for one sample collapse into a single row.

extra_fn_clean_exts:
  - ".filtered"
  - ".trimmed"
  - ".clean"
  - ".bracken.S"
  - ".bracken.G"
  - ".bracken.S.report"
  - ".bracken.G.report"
  - ".kaiju"
  - ".kaiju.species"
  - ".kaiju.genus"
  - ".kraken2"
  - ".kraken2.report"
  - ".kraken2.out"
  - ".sylph"
  - ".sorted"
  - ".fastq"
  - ".fastq.gz"

fn_clean_sample_names: true

# ── Separate FastQC raw and filtered into distinct sections ───
# Use the source directories to distinguish raw vs filtered.

module_order:
  - fastqc:
      name: "FastQC (Raw Reads)"
      path_filters:
        - "*/01_qc_raw/fastqc/*"
  - fastqc:
      name: "FastQC (Filtered Reads)"
      path_filters:
        - "*/06_qc_filtered/fastqc/*"
  - nanostat
  - fastq_screen
  - kraken
  - kaiju
  - busco

# ── Section order ─────────────────────────────────────────────
report_section_order:
  fastqc-raw-reads:
    order: 100
  fastqc-filtered-reads:
    order: 200
  fastq_screen:
    order: 300
  nanostat:
    order: 400
  kraken:
    order: 500
  kaiju:
    order: 600

# ── Title and branding ────────────────────────────────────────
title: "EpiTax — QC Report"
subtitle: "Nanopore Metagenomics Pipeline | FISABIO — EPIMOL"
intro_text: "Integrated QC report for the EpiTax pipeline."

custom_logo: null
custom_logo_url: null
custom_logo_title: null

show_analysis_paths: false
show_analysis_time: true

# ── General Statistics table ──────────────────────────────────
# Columns shown by default
table_columns_visible:
  FastQC (Raw Reads):
    percent_duplicates: false
  FastQC (Filtered Reads):
    percent_duplicates: false
